<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Vinayaka Wishes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="ganesha-icon">🐘</div>
            <h1>Lord Vinayaka Wishes</h1>
            <p>May Lord Ganesha bless you</p>
        </header>

        <main>
            <div class="wishes-container">
                <div class="wish-card">
                    <p class="wish-text">OM GANANATHAM TAMAHU VAYAM</p>
                    <p class="wish-meaning">We bow to the Lord of All Beings</p>
                </div>
            </div>

            <div class="animation-section">
                <div class="animated-lotus"></div>
            </div>

            <button class="wish-button" onclick="nextWish()">Get Another Wish 🙏</button>
        </main>

        <footer>
            <p>May Lord Ganesha guide your path to success and remove all obstacles</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
